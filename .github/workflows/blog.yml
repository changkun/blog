name: blog
on:
  push:
    branches: [ main ]
concurrency: blog
jobs:

  deploy:
    name: blog
    runs-on: ubuntu-latest
    steps:

    - name: Pull the blog on the server
      env:
        USER: ${{ secrets.SERVER_USER }}
        TARGET: ${{ secrets.SERVER_PATH }}
        KEY: ${{ secrets.SERVER_KEY }}
        DOMAIN: ${{ secrets.SERVER_DOMAIN }}
      run: |
        mkdir -p ~/.ssh
        echo "$KEY" | tr -d '\r' > ~/.ssh/idkey
        chmod 400 ~/.ssh/idkey
        ssh-keyscan -H "$DOMAIN" >> ~/.ssh/known_hosts
        ssh -i ~/.ssh/idkey "$USER@$DOMAIN" "git -C '$TARGET' pull --ff-only -q"
