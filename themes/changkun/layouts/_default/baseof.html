{{ partial "head.html" . }}
<body>
<div class="container one-collumn sidebar-position-left {{ block "main_class" .}}{{end}}  ">
    <div class="headband"></div>

    <aside class="sidebar-wrapper">
      <div class="header-inner"> {{ partial "header.html" . }} </div>
      <div class="sidebar-inner">
        {{ partial "sidebar.html" . }}
      </div>
    </aside>

    <div class="sidebar-overlay"></div>
    <div class="mobile-header">
      <button class="drawer-toggle" aria-label="Toggle menu">
        <span class="btn-bar"></span>
        <span class="btn-bar"></span>
        <span class="btn-bar"></span>
      </button>
    </div>

    <main id="main" class="main">
      <div class="content-wrap">
        <div id="content" class="content">
          {{ block "main_content" . }}{{end}}
        </div>
      </div>
      <footer id="footer" class="footer">
        <div class="footer-inner">
          {{ partial "footer.html" . }}
        </div>
      </footer>
    </main>

    <div class="back-to-top">
      <svg class="back-to-top-ring" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
        <circle class="back-to-top-progress" cx="20" cy="20" r="18" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="113.1" stroke-dashoffset="113.1" stroke-linecap="round" transform="rotate(-90 20 20)"/>
      </svg>
      <i class="fa fa-arrow-up"></i>
      <span id="scrollpercent"><span>0</span>%</span>
    </div>
  </div>

  {{ partial "script.html" .}}
</body>
</html>
