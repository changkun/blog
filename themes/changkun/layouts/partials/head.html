<!DOCTYPE HTML>
<html lang="{{ with .Site.LanguageCode }}{{ . }}{{ else }}zh-CN{{ end }}">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" /> 
    <title>{{ if ne .Permalink " / " }}{{ .Title }} - {{ end }}{{ .Site.Title }}</title>
    {{ if .Keywords }}<meta name="keywords" content="{{ range .Keywords }}{{ . }},{{ end }}">
    {{ else }}<meta name="keywords" content="{{ .Site.Params.Keywords }}">{{ end }}
    {{ with .Site.Params.Author.Name }}<meta name="author" content="{{ . }}">{{ end }}
    <meta property="og:title" content="{{ if ne .Permalink " / " }}{{ .Title }}{{else}}{{ .Site.Title }}{{end}}">
    <meta property="og:site_name" content="{{ .Site.Title }}">
    <meta property="og:image" content="https://changkun.de/logo.png">
    <meta name="title" content="{{ if ne .Permalink " / " }}{{ .Title }} - {{ end }}{{ .Site.Title }}" />
    {{ with .Description }}<meta name="description" content="{{ . }}" />
    {{ else }}<meta name="description" content="{{ .Site.Params.Description }}">{{ end }} 
    <link rel="icon" href="https://changkun.de/logo.png" />
    <link href="/js/vendor/font-awesome/css/font-awesome.min.css?v=4.6.2" rel="stylesheet" type="text/css" />
    {{ if and .Site.Params.Fancybox .IsPage}}<link href="/js/vendor/fancybox/jquery.fancybox.css?v=2.1.5" rel="stylesheet" type="text/css" />{{ end }}
    <link href="/css/main.css" rel="stylesheet" type="text/css" />
    <link href="/css/syntax.css" rel="stylesheet" type="text/css" />
    <script type="text/javascript">
      // Apply theme immediately to prevent flash of wrong theme.
      (function() {
        var pref = localStorage.getItem('theme');
        // Migrate old key
        if (!pref) {
          var old = localStorage.getItem('dark-mode');
          if (old === 'true') pref = 'dark';
          else if (old === 'false') pref = 'light';
          else pref = 'auto';
        }
        var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) {
          document.documentElement.style.visibility = 'hidden';
          document.documentElement.style.background = '#181a1b';
        }
      })();
    </script>
    <script type="text/javascript">
      var NexT = window.NexT || {};
      var CONFIG = {
        scheme: 'Pisces',
        sidebar: {"position":"left","display":"post"},
        {{ if and .Site.Params.Fancybox .IsPage}} fancybox: true, {{ else }}fancybox: false, {{ end }}
        motion: true
      };
    </script>
    <script async src="https://www.changkun.de/urlstat/client.js"></script>
</head>
