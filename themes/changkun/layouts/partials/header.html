<div class="site-meta {{ if .Site.Params.Imglogo }} custom-logo {{ end }}">

  <div class="custom-logo-site-title">
    <a href="{{ .Site.BaseURL }}"  class="brand" rel="start">
      <span class="logo-line-before"><i></i></span>
      <span class="site-title">{{ partial "bilingual.html" "SiteTitle" }}</span>
      <span class="logo-line-after"><i></i></span>
    </a>
  </div>
  <p class="site-subtitle">{{ partial "bilingual.html" "SiteSubtitle" }}</p>
</div>

<div class="site-nav-toggle">
  <button>
    <span class="btn-bar"></span>
    <span class="btn-bar"></span>
    <span class="btn-bar"></span>
  </button>
</div>

<nav class="site-nav">
    <ul id="menu" class="menu">
      {{ $currentPage := . }}
      {{ range .Site.Menus.main }}
        {{ $menuKey := printf "Menu%s" .Name }}
        <li class="menu-item {{ if $currentPage.IsMenuCurrent "main" . }}menu-item-active{{ end }}">
          <a href="{{ .URL }}" rel="section">{{ partial "bilingual.html" $menuKey }}</a>
        </li>
      {{ end }}
    </ul>
</nav>
